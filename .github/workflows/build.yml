name: Сборка Atom Lite

# Заменяет мёртвый Azure Pipelines (script/vsts): он ссылался на образ
# macos-10.15, которого больше не существует, и на Node 12.16.3 из 2020 года.
#
# Даёт то, чего у форка не было: возможность собрать Atom.app в облаке GitHub
# и скачать готовый архив, не настраивая сборочное окружение у себя.
# Для публичных репозиториев macOS-раннеры бесплатны.
#
# ── Что пришлось починить, чтобы это заработало ─────────────────────────────
#
# 1. АРХИТЕКТУРА. Бесплатные macOS-раннеры у GitHub только arm64 (Apple
#    Silicon); интеловские ярлыки вроде macos-15-intel остались на платных
#    тарифах. Скрипты сборки Atom написаны под Node 12.16.3, а Node 12
#    существует только для x64 — поэтому ставим Rosetta 2 и запускаем Node 12
#    как x64-процесс. Целевую архитектуру задаём отдельно, через ATOM_ARCH.
#
# 2. XCODE. С Xcode 16.3 Apple начала определять TARGET_OS_MAC, от чего ломается
#    старый zlib внутри git-utils/libgit2: он подменяет fdopen, и системный
#    <stdio.h> перестаёт компилироваться (_stdio.h:318: error: expected ')').
#    Обе задачи поэтому переключаются на Xcode 16.2.
#
# 3. МЁРТВЫЙ atom.io. apm передаёт node-gyp адрес заголовков Electron
#    https://atom.io/download/electron — домен закрыт вместе с проектом, вместо
#    архива приходит HTML-страница. Скачиваем заголовки сами (ATOM_ELECTRON_URL
#    + прогрев кэша node-gyp), как это сделано в живом форке Pulsar.
#
# 4. APPLE И iconv. В Xcode 16 тип iconv_t перестал быть void* и стал указателем
#    на неполный тип, из-за чего не собирается superstring — ядро текстовых
#    буферов Atom. Лечится заголовком script/macos-iconv-compat.h.
#
# 5. apm И АРХИТЕКТУРА. atom-package-manager для macOS жёстко требует x64
#    (lib/apm.js, getElectronArch) — поэтому нативной сборки под Apple Silicon
#    не существовало в принципе. Правка живёт в script/lib/install-apm.js.

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Нужно, чтобы при падении сборки CI мог сохранить логи в репозиторий: обычные
# логи job'ов недоступны извне, а аннотации ограничены по количеству и приходят
# в произвольном порядке.
permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Основная задача: сборка под Intel. Именно так собирался Atom всегда,
  # поэтому путь самый предсказуемый. На Apple Silicon приложение работает
  # через Rosetta 2 (она же нужна сборочному Node 12).
  # ═══════════════════════════════════════════════════════════════════════════
  build-x64:
    name: macOS x64 (через Rosetta)
    runs-on: macos-15
    timeout-minutes: 180

    env:
      npm_config_arch: x64
      # Собирать нативные модули из исходников, а не брать готовые бинарники:
      # готовые собраны под другую ABI и не подойдут для Electron 11.5.0.
      npm_config_build_from_source: 'true'
      # Адрес заголовков Electron для apm (иначе — мёртвый atom.io).
      ATOM_ELECTRON_URL: https://artifacts.electronjs.org/headers/dist
      # Разрешить node-gyp брать заголовки из готового кэша ~/.node-gyp.
      npm_config_ensure: 'true'
      # Новые macOS SDK сделали iconv_t указателем на неполный тип
      # (struct __tag_iconv_t *), и старый код вроде superstring 2.4.4
      # больше не собирается: void* не приводится к iconv_t неявно.
      # Заголовок возвращает прежние приведения; node-gyp подмешивает
      # CFLAGS/CXXFLAGS в каждую команду компиляции
      # (CXXFLAGS.target ?= $(CPPFLAGS) $(CXXFLAGS) в make-генераторе gyp).
      CFLAGS: -include ${{ github.workspace }}/script/macos-iconv-compat.h
      CXXFLAGS: -include ${{ github.workspace }}/script/macos-iconv-compat.h

    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Rosetta 2 (для Node 12 — сборки под arm64 у него нет)
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Node.js 12.16.3 (x64)
        uses: actions/setup-node@v4
        with:
          node-version: '12.16.3'
          architecture: 'x64'

      - name: Python 3.9 (node-gyp 5 не работает с Python 3.12+)
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # Xcode 16.3+ определяет TARGET_OS_MAC, из-за чего старый zlib внутри
      # git-utils/libgit2 ломает системный <stdio.h>. В 16.2 этого нет.
      - name: Xcode 16.2 (в 16.3+ старые нативные модули не собираются)
        run: |
          for v in 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app/Contents/Developer"
              echo "Выбран Xcode $v"
              break
            fi
          done
          echo "DEVELOPER_DIR: $(xcode-select -p)"
          xcodebuild -version
          echo "SDK: $(xcrun --show-sdk-version)"

      - name: Окружение
        run: |
          echo "Машина:       $(uname -m)"
          echo "Node:         $(node --version) (process.arch=$(node -p 'process.arch'))"
          echo "npm:          $(npm --version)"
          echo "Python:       $(python3 --version)"
          echo "Целевая арх.: $npm_config_arch"
          sw_vers

      # node-gyp скачивает заголовки Electron с адреса, который ему передал
      # apm. apm 2.6.2 по умолчанию указывает на мёртвый сайт
      # https://atom.io/download/electron. Скачиваем сами через curl:
      # он умеет следовать редиректам, а node-gyp 5 — нет.
      - name: Заголовки Electron 11.5.0 в кэш node-gyp
        run: |
          set -euo pipefail
          VDIR="$HOME/.node-gyp/11.5.0"
          mkdir -p "$VDIR"
          BASE="${ATOM_ELECTRON_URL:-https://artifacts.electronjs.org/headers/dist}"
          echo "Основная ссылка: $BASE/v11.5.0/node-v11.5.0-headers.tar.gz"
          curl -sSL -o /dev/null -w '  HTTP %{http_code} → %{url_effective}\n' \
            "$BASE/v11.5.0/node-v11.5.0-headers.tar.gz" || true

          for url in \
            "$BASE/v11.5.0/node-v11.5.0-headers.tar.gz" \
            "https://electronjs.org/headers/v11.5.0/node-v11.5.0-headers.tar.gz" \
            "https://artifacts.electronjs.org/headers/dist/v11.5.0/node-v11.5.0-darwin-x64.tar.gz" \
            "https://artifacts.electronjs.org/headers/dist/v11.5.0/node-v11.5.0-darwin-arm64.tar.gz" \
          ; do
            echo "Пробую: $url"
            if curl -fsSL --retry 2 --connect-timeout 20 -o /tmp/node-headers.tgz "$url" \
               && tar -tzf /tmp/node-headers.tgz >/dev/null 2>&1; then
              rm -rf "$VDIR"; mkdir -p "$VDIR"
              tar -xzf /tmp/node-headers.tgz --strip-components=1 -C "$VDIR"
              if [ -f "$VDIR/include/node/node.h" ]; then
                echo 9 > "$VDIR/installVersion"
                echo "✓ Заголовки на месте, файлов .h: $(find "$VDIR" -name '*.h' | wc -l | tr -d ' ')"
                exit 0
              fi
              echo "…  в архиве нет include/node/node.h"
            else
              echo "…  не скачалось"
            fi
          done
          echo "::error title=headers::Заголовки Electron 11.5.0 не скачались ни с одного зеркала"
          exit 1

      # vscode-ripgrep 1.9.0 для macOS жёстко качает сборку x86_64 через GitHub
      # API, а тот без токена отдаёт 403 (лимит запросов на общем раннере).
      # Кладём нужный архив в кэш пакета заранее — тогда он в сеть не пойдёт.
      - name: ripgrep под целевую архитектуру
        run: |
          node script/lib/prepare-ripgrep.js 2>&1 | tee rg.log
          CACHE=$(node -p "require('path').join(require('os').tmpdir(),'vscode-ripgrep-cache-1.9.0','ripgrep-v12.1.1-x86_64-apple-darwin.tar.gz')")
          if [ -f "$CACHE" ]; then
            echo "::notice title=ripgrep::архив для $npm_config_arch в кэше ($(du -h "$CACHE" | cut -f1)) — в сеть пакет не пойдёт"
          else
            echo "::warning title=ripgrep::архива в кэше нет — пакет попробует скачать сам, вероятен 403"
          fi
          grep -a "ripgrep:" rg.log | tr -d '\r' | while IFS= read -r l; do
            echo "::notice title=ripgrep::${l#ripgrep: }"
          done

      - name: Bootstrap
        id: bootstrap
        run: |
          set +e
          script/bootstrap 2>&1 | tee bootstrap.log
          exit ${PIPESTATUS[0]}

      - name: Диагностика bootstrap — ошибки npm
        if: failure()
        run: |
          grep -a "npm ERR" bootstrap.log | tail -8 | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=npm-err::$l"
          done

      - name: Диагностика bootstrap — ошибки сборки
        if: failure()
        run: |
          grep -aiE "gyp ERR|error:|fatal error|not found:|ETARGET|E404|ENOTFOUND|Failed to" bootstrap.log | tail -10 | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=build-err::$l"
          done

      - name: Диагностика bootstrap — окно вокруг первой ошибки
        if: failure()
        run: |
          LINE=$(grep -a -n "error:" bootstrap.log | head -1 | cut -d: -f1)
          if [ -n "$LINE" ]; then
            FROM=$((LINE-5)); [ "$FROM" -lt 1 ] && FROM=1
            sed -n "${FROM},$((LINE+15))p" bootstrap.log | tr -d '\r' | while IFS= read -r l; do
              echo "::error title=first-error::$l"
            done
          fi

      - name: Диагностика bootstrap — контекст
        if: failure()
        run: |
          tail -20 bootstrap.log | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=context::$l"
          done

      - name: Сборка приложения
        id: build
        run: |
          set +e
          script/build --compress-artifacts 2>&1 | tee build.log
          CODE=${PIPESTATUS[0]}
          echo "код возврата script/build: $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "::error title=код возврата::script/build завершился с кодом $CODE (137 — убит по памяти, 143 — прерван)"
            exit 1
          fi

      - name: Диагностика сборки — ошибки по порядку
        if: failure()
        run: |
          echo "::error title=лог::строк в build.log: $(wc -l < build.log | tr -d ' ')"
          grep -a -n -iE "error|failed|cannot|unable|not found|killed|traceback|no such file" build.log | head -10 | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=ошибка::$l"
          done

      - name: Диагностика сборки — хвост лога
        if: failure()
        run: |
          tail -10 build.log | grep -a . | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=хвост::$l"
          done

      # Аннотации ограничены по количеству и приходят в произвольном порядке,
      # а логи job'ов недоступны извне. Поэтому при падении сохраняем логи
      # прямо в репозиторий — с пометкой [skip ci], чтобы не гонять сборку снова.
      - name: Логи для разбора — в репозиторий
        if: failure()
        continue-on-error: true
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          mkdir -p .ci-logs
          for f in build.log bootstrap.log rg.log; do
            if [ -f "$f" ]; then cp "$f" ".ci-logs/$f"; fi
          done
          ls -la out/ > .ci-logs/out-listing.txt 2>&1 || true
          git add -f .ci-logs
          git commit -qm "ci: логи прогона ${{ github.run_id }} [skip ci]"
          git push -q origin HEAD:${{ github.ref_name }}

      # Печатаем факты о сборке аннотациями: обычные логи runner не отдаёт,
      # а аннотации читаются через API GitHub — так результат можно проверить.
      - name: Проверка — архитектура и размер
        if: success()
        run: |
          APP="out/Atom.app"
          BIN="$APP/Contents/MacOS/Atom"
          echo "::notice title=проверка::бинарник: $(lipo -archs "$BIN")"
          echo "::notice title=проверка::приложение $(du -sh "$APP" | cut -f1), архив $(ls -lh out/*.zip | awk '{print $5}')"
          echo "::notice title=проверка::нативных модулей .node: $(find "$APP" -name '*.node' | wc -l | tr -d ' ')"
          find "$APP" -name 'v8_context_snapshot*' | while IFS= read -r f; do
            echo "::notice title=проверка::$(basename "$f") — $(lipo -archs "$f" 2>/dev/null || echo 'не Mach-O')"
          done
          RG=$(find "$APP" -type f -name rg | head -1)
          if [ -n "$RG" ]; then
            echo "::notice title=ripgrep::$(file -b "$RG")"
          else
            echo "::warning title=ripgrep::бинарь rg не найден в приложении"
          fi

      - name: Проверка — архитектура нативных модулей
        if: success()
        run: |
          APP="out/Atom.app"
          find "$APP" -name '*.node' | sort | head -14 | while IFS= read -r f; do
            echo "::notice title=модуль::$(echo "$f" | sed "s|.*/node_modules/||") → $(lipo -archs "$f" 2>/dev/null || echo '?')"
          done

      - name: Загрузить артефакт
        if: success()
        run: |
          mkdir -p artifacts
          for f in out/*.zip; do
            cp "$f" "artifacts/$(basename "$f" .zip)-x64.zip"
          done
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: atom-macos-x64
          path: artifacts/*.zip
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # Нативная сборка под Apple Silicon.
  #
  # Раньше её не существовало: apm для macOS жёстко требовал x64. Теперь apm
  # (после правки в script/lib/install-apm.js) берёт архитектуру из ATOM_ARCH,
  # поэтому достаточно задать её здесь — дальше установка нативных модулей,
  # загрузка Electron и упаковка идут под arm64, как обычно.
  #
  # npm_config_arch=arm64 нужен ещё и потому, что от него зависит загрузка
  # electron-mksnapshot: снапшот V8 обязан быть собран той же архитектурой,
  # что и целевой Electron.
  # ═══════════════════════════════════════════════════════════════════════════
  build-arm64:
    name: macOS arm64 (нативная)
    runs-on: macos-15
    timeout-minutes: 180

    env:
      # Целевая архитектура: apm читает ATOM_ARCH (наша правка),
      # script/config.js — npm_config_arch.
      ATOM_ARCH: arm64
      npm_config_arch: arm64
      npm_config_build_from_source: 'true'
      ATOM_ELECTRON_URL: https://artifacts.electronjs.org/headers/dist
      npm_config_ensure: 'true'
      CFLAGS: -include ${{ github.workspace }}/script/macos-iconv-compat.h
      CXXFLAGS: -include ${{ github.workspace }}/script/macos-iconv-compat.h

    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Rosetta 2 (для Node 12 — сборки под arm64 у него нет)
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Node.js 12.16.3 (x64)
        uses: actions/setup-node@v4
        with:
          node-version: '12.16.3'
          architecture: 'x64'

      - name: Python 3.9 (node-gyp 5 не работает с Python 3.12+)
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Xcode 16.2 (в 16.3+ старые нативные модули не собираются)
        run: |
          for v in 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app/Contents/Developer"
              echo "Выбран Xcode $v"
              break
            fi
          done
          echo "DEVELOPER_DIR: $(xcode-select -p)"
          xcodebuild -version
          echo "SDK: $(xcrun --show-sdk-version)"

      - name: Окружение
        run: |
          echo "Машина:       $(uname -m)"
          echo "Node:         $(node --version) (process.arch=$(node -p 'process.arch'))"
          echo "npm:          $(npm --version)"
          echo "Python:       $(python3 --version)"
          echo "Целевая арх.: $ATOM_ARCH (npm_config_arch=$npm_config_arch)"
          sw_vers

      - name: Заголовки Electron 11.5.0 в кэш node-gyp
        run: |
          set -euo pipefail
          VDIR="$HOME/.node-gyp/11.5.0"
          mkdir -p "$VDIR"
          BASE="${ATOM_ELECTRON_URL:-https://artifacts.electronjs.org/headers/dist}"
          echo "Основная ссылка: $BASE/v11.5.0/node-v11.5.0-headers.tar.gz"
          curl -sSL -o /dev/null -w '  HTTP %{http_code} → %{url_effective}\n' \
            "$BASE/v11.5.0/node-v11.5.0-headers.tar.gz" || true

          for url in \
            "$BASE/v11.5.0/node-v11.5.0-headers.tar.gz" \
            "https://electronjs.org/headers/v11.5.0/node-v11.5.0-headers.tar.gz" \
            "https://artifacts.electronjs.org/headers/dist/v11.5.0/node-v11.5.0-darwin-arm64.tar.gz" \
            "https://artifacts.electronjs.org/headers/dist/v11.5.0/node-v11.5.0-darwin-x64.tar.gz" \
          ; do
            echo "Пробую: $url"
            if curl -fsSL --retry 2 --connect-timeout 20 -o /tmp/node-headers.tgz "$url" \
               && tar -tzf /tmp/node-headers.tgz >/dev/null 2>&1; then
              rm -rf "$VDIR"; mkdir -p "$VDIR"
              tar -xzf /tmp/node-headers.tgz --strip-components=1 -C "$VDIR"
              if [ -f "$VDIR/include/node/node.h" ]; then
                echo 9 > "$VDIR/installVersion"
                echo "✓ Заголовки на месте, файлов .h: $(find "$VDIR" -name '*.h' | wc -l | tr -d ' ')"
                exit 0
              fi
              echo "…  в архиве нет include/node/node.h"
            else
              echo "…  не скачалось"
            fi
          done
          echo "::error title=headers::Заголовки Electron 11.5.0 не скачались ни с одного зеркала"
          exit 1

      - name: ripgrep под целевую архитектуру
        run: |
          node script/lib/prepare-ripgrep.js 2>&1 | tee rg.log
          CACHE=$(node -p "require('path').join(require('os').tmpdir(),'vscode-ripgrep-cache-1.9.0','ripgrep-v12.1.1-x86_64-apple-darwin.tar.gz')")
          if [ -f "$CACHE" ]; then
            echo "::notice title=ripgrep::архив для $ATOM_ARCH в кэше ($(du -h "$CACHE" | cut -f1)) — в сеть пакет не пойдёт"
          else
            echo "::warning title=ripgrep::архива в кэше нет — пакет попробует скачать сам, вероятен 403"
          fi
          grep -a "ripgrep:" rg.log | tr -d '\r' | while IFS= read -r l; do
            echo "::notice title=ripgrep::${l#ripgrep: }"
          done

      - name: Bootstrap (нативные модули под arm64)
        id: bootstrap
        run: |
          set +e
          script/bootstrap 2>&1 | tee bootstrap.log
          exit ${PIPESTATUS[0]}

      - name: Диагностика bootstrap — ошибки npm
        if: failure()
        run: |
          grep -a "npm ERR" bootstrap.log | tail -8 | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=npm-err::$l"
          done

      - name: Диагностика bootstrap — ошибки сборки
        if: failure()
        run: |
          grep -aiE "gyp ERR|error:|fatal error|not found:|ETARGET|E404|ENOTFOUND|Failed to" bootstrap.log | tail -10 | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=build-err::$l"
          done

      - name: Диагностика bootstrap — окно вокруг первой ошибки
        if: failure()
        run: |
          LINE=$(grep -a -n "error:" bootstrap.log | head -1 | cut -d: -f1)
          if [ -n "$LINE" ]; then
            FROM=$((LINE-5)); [ "$FROM" -lt 1 ] && FROM=1
            sed -n "${FROM},$((LINE+15))p" bootstrap.log | tr -d '\r' | while IFS= read -r l; do
              echo "::error title=first-error::$l"
            done
          fi

      - name: Диагностика bootstrap — контекст
        if: failure()
        run: |
          tail -20 bootstrap.log | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=context::$l"
          done

      - name: Сборка приложения под arm64
        id: build
        run: |
          set +e
          script/build --compress-artifacts 2>&1 | tee build.log
          CODE=${PIPESTATUS[0]}
          echo "код возврата script/build: $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "::error title=код возврата::script/build завершился с кодом $CODE (137 — убит по памяти, 143 — прерван)"
            exit 1
          fi

      - name: Диагностика сборки — ошибки по порядку
        if: failure()
        run: |
          echo "::error title=лог::строк в build.log: $(wc -l < build.log | tr -d ' ')"
          grep -a -n -iE "error|failed|cannot|unable|not found|killed|traceback|no such file" build.log | head -10 | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=ошибка::$l"
          done

      - name: Диагностика сборки — хвост лога
        if: failure()
        run: |
          tail -10 build.log | grep -a . | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=хвост::$l"
          done

      # Аннотации ограничены по количеству и приходят в произвольном порядке,
      # а логи job'ов недоступны извне. Поэтому при падении сохраняем логи
      # прямо в репозиторий — с пометкой [skip ci], чтобы не гонять сборку снова.
      - name: Логи для разбора — в репозиторий
        if: failure()
        continue-on-error: true
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          mkdir -p .ci-logs
          for f in build.log bootstrap.log rg.log; do
            if [ -f "$f" ]; then cp "$f" ".ci-logs/$f"; fi
          done
          ls -la out/ > .ci-logs/out-listing.txt 2>&1 || true
          git add -f .ci-logs
          git commit -qm "ci: логи прогона ${{ github.run_id }} [skip ci]"
          git push -q origin HEAD:${{ github.ref_name }}

      - name: Проверка — архитектура и размер
        if: success()
        run: |
          APP="out/Atom.app"
          BIN="$APP/Contents/MacOS/Atom"
          ARCHS=$(lipo -archs "$BIN")
          echo "::notice title=проверка::бинарник: $ARCHS"
          echo "::notice title=проверка::приложение $(du -sh "$APP" | cut -f1), архив $(ls -lh out/*.zip | awk '{print $5}')"
          echo "::notice title=проверка::нативных модулей .node: $(find "$APP" -name '*.node' | wc -l | tr -d ' ')"
          find "$APP" -name 'v8_context_snapshot*' | while IFS= read -r f; do
            echo "::notice title=проверка::$(basename "$f") — $(lipo -archs "$f" 2>/dev/null || echo 'не Mach-O')"
          done
          RG=$(find "$APP" -type f -name rg | head -1)
          if [ -n "$RG" ]; then
            echo "::notice title=ripgrep::$(file -b "$RG")"
          else
            echo "::warning title=ripgrep::бинарь rg не найден в приложении"
          fi
          if [ "$ARCHS" != "arm64" ]; then
            echo "::error title=архитектура::ожидался arm64, а получился $ARCHS"
            exit 1
          fi

      - name: Проверка — всё ли действительно arm64
        if: success()
        run: |
          APP="out/Atom.app"
          BAD=$(mktemp)
          find "$APP" -name '*.node' | sort | while IFS= read -r f; do
            A=$(lipo -archs "$f" 2>/dev/null || echo '?')
            echo "::notice title=модуль::$(echo "$f" | sed "s|.*/node_modules/||") → $A"
            case "$A" in
              *arm64*) ;;
              *) echo "нет" >> "$BAD"
                 echo "::error title=битый модуль::$(basename "$f") собран не под arm64: $A" ;;
            esac
          done
          RG=$(find "$APP" -type f -name rg | head -1)
          if [ -n "$RG" ]; then
            RGINFO=$(file -b "$RG")
            echo "::notice title=ripgrep::rg → $RGINFO"
            case "$RGINFO" in
              *arm64*) ;;
              *) echo "нет" >> "$BAD"
                 echo "::error title=ripgrep::сборка ripgrep не под arm64: $RGINFO" ;;
            esac
          else
            echo "::warning title=ripgrep::бинарь rg не найден в приложении"
          fi
          if [ -s "$BAD" ]; then
            echo "::error title=итог::в сборке есть компоненты не под arm64"
            exit 1
          fi
          echo "::notice title=итог::все нативные модули и ripgrep собраны под arm64"

      - name: Загрузить артефакт
        if: success()
        run: |
          mkdir -p artifacts
          for f in out/*.zip; do
            cp "$f" "artifacts/$(basename "$f" .zip)-arm64.zip"
          done
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: atom-macos-arm64
          path: artifacts/*.zip
          if-no-files-found: error
