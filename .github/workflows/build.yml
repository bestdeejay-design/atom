name: Сборка Atom Lite

# ATOM LITE: заменяет мёртвый Azure Pipelines (script/vsts), который ссылался
# на несуществующий образ macos-10.15 и Node 12.16.3 из 2020 года.
#
# Даёт то, чего у форка не было: возможность собрать Atom.app в облаке GitHub
# и скачать готовый архив, не настраивая сборочное окружение у себя.
# Для публичных репозиториев macOS-раннеры бесплатны.
#
# ── Про архитектуры ────────────────────────────────────────────────────────
# Бесплатные образы macOS у GitHub — только arm64 (Apple Silicon).
# Интеловские ярлыки вроде macos-15-intel остались на платных тарифах.
#
# Скрипты сборки Atom написаны под Node 12.16.3, а Node 12 существует
# только для x64. Поэтому мы ставим Rosetta 2 и запускаем Node 12 как
# x64-процесс — на arm64-машине это работает.
#
# ── Про Xcode ──────────────────────────────────────────────────────────────
# С Xcode 16.3 Apple начала определять TARGET_OS_MAC. От этого ломается
# старый zlib внутри git-utils/libgit2: он подменяет fdopen, и системный
# <stdio.h> не парсится (_stdio.h:318: error: expected ')'). Поэтому обе
# задачи переключаются на Xcode 16.2, где бага ещё нет.
#
# Отсюда две задачи:
#   · x64   — заведомо рабочий путь, повторяет конфигурацию оригинального CI.
#             Приложение соберётся интеловским и запустится через Rosetta 2.
#   · arm64 — нативная сборка. Требует пересборки нативных модулей после
#             bootstrap (см. пояснение в задаче), поэтому помечена как
#             экспериментальная.

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Основная задача: интеловская сборка. Повторяет то, что работало в CI
  # оригинального Atom, поэтому самая предсказуемая.
  # ═══════════════════════════════════════════════════════════════════════════
  build-x64:
    name: macOS x64 (через Rosetta)
    runs-on: macos-15
    timeout-minutes: 180

    env:
      npm_config_arch: x64
      # Собирать нативные модули из исходников, а не брать готовые бинарники:
      # готовые собраны под другую ABI и не подойдут для Electron 11.5.0.
      npm_config_build_from_source: 'true'

    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Rosetta 2 (для Node 12 — сборки под arm64 у него нет)
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Node.js 12.16.3 (x64)
        uses: actions/setup-node@v4
        with:
          node-version: '12.16.3'
          architecture: 'x64'

      - name: Python 3.9 (node-gyp 5 не работает с Python 3.12+)
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # Xcode 16.3+ определяет TARGET_OS_MAC, из-за чего старый zlib внутри
      # git-utils/libgit2 ломает системный <stdio.h>. В 16.2 этого нет.
      - name: Xcode 16.2 (в 16.3+ старые нативные модули не собираются)
        run: |
          for v in 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app/Contents/Developer"
              echo "Выбран Xcode $v"
              break
            fi
          done
          echo "DEVELOPER_DIR: $(xcode-select -p)"
          xcodebuild -version
          echo "SDK: $(xcrun --show-sdk-version)"

      - name: Окружение
        run: |
          echo "Машина:       $(uname -m)"
          echo "Node:         $(node --version) (process.arch=$(node -p 'process.arch'))"
          echo "npm:          $(npm --version)"
          echo "Python:       $(python3 --version)"
          echo "Целевая арх.: $npm_config_arch"
          sw_vers

      - name: Bootstrap
        id: bootstrap
        run: |
          set +e
          script/bootstrap 2>&1 | tee bootstrap.log
          exit ${PIPESTATUS[0]}

      - name: Диагностика bootstrap — ошибки npm
        if: failure()
        run: |
          grep -a "npm ERR" bootstrap.log | tail -12 | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=npm-err::$l"
          done

      - name: Диагностика bootstrap — ошибки сборки
        if: failure()
        run: |
          grep -aiE "gyp ERR|error:|fatal error|not found:|ETARGET|E404|ENOTFOUND|Failed to" bootstrap.log | tail -10 | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=build-err::$l"
          done

      - name: Диагностика bootstrap — окно вокруг первой ошибки
        if: failure()
        run: |
          LINE=$(grep -a -n "error:" bootstrap.log | head -1 | cut -d: -f1)
          if [ -n "$LINE" ]; then
            FROM=$((LINE-5)); [ "$FROM" -lt 1 ] && FROM=1
            sed -n "${FROM},$((LINE+15))p" bootstrap.log | tr -d '\r' | while IFS= read -r l; do
              echo "::error title=first-error::$l"
            done
          fi

      - name: Диагностика bootstrap — контекст
        if: failure()
        run: |
          tail -30 bootstrap.log | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=context::$l"
          done

      - name: Сборка приложения
        id: build
        run: |
          set -o pipefail
          script/build --compress-artifacts 2>&1 | tee build.log

      - name: Диагностика сборки
        if: failure()
        run: |
          tail -30 build.log | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=build::$l"
          done

      - name: Что получилось
        if: success()
        run: |
          ls -lh out/ | head -20
          du -sh out/*.app 2>/dev/null || true
          file out/Atom.app/Contents/MacOS/Atom 2>/dev/null || true

      - name: Загрузить артефакт
        if: success()
        run: |
          mkdir -p artifacts
          for f in out/*.zip; do
            cp "$f" "artifacts/$(basename "$f" .zip)-x64.zip"
          done
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: atom-macos-x64
          path: artifacts/*.zip
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # Экспериментальная задача: нативная arm64-сборка.
  #
  # Почему нельзя просто задать npm_config_arch=arm64 на весь процесс:
  # установщик apm (`install-apm.js`) в своём postinstall запускает
  # `./bin/npm rebuild`, который собирает нативные модули под ту архитектуру,
  # что указана в npm_config_arch. Получается x64-процесс, собирающий
  # arm64-модули для себя же — это и валило bootstrap.
  #
  # Поэтому в два приёма: bootstrap под x64 (как в рабочем CI),
  # затем отдельная пересборка нативных модулей под arm64+Electron,
  # и только потом сборка приложения под arm64.
  # ═══════════════════════════════════════════════════════════════════════════
  build-arm64:
    name: macOS arm64 (нативная, экспериментальная)
    runs-on: macos-15
    timeout-minutes: 180
    continue-on-error: true

    env:
      npm_config_build_from_source: 'true'

    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Rosetta 2 (для Node 12)
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Node.js 12.16.3 (x64)
        uses: actions/setup-node@v4
        with:
          node-version: '12.16.3'
          architecture: 'x64'

      - name: Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Xcode 16.2 (в 16.3+ старые нативные модули не собираются)
        run: |
          for v in 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app/Contents/Developer"
              echo "Выбран Xcode $v"
              break
            fi
          done
          echo "DEVELOPER_DIR: $(xcode-select -p)"
          xcodebuild -version
          echo "SDK: $(xcrun --show-sdk-version)"

      - name: Bootstrap (под x64 — так apm ставится без ошибок)
        id: bootstrap
        env:
          npm_config_arch: x64
        run: |
          set +e
          script/bootstrap 2>&1 | tee bootstrap.log
          exit ${PIPESTATUS[0]}

      - name: Диагностика bootstrap — ошибки npm
        if: failure()
        run: |
          grep -a "npm ERR" bootstrap.log | tail -8 | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=npm-err::$l"
          done

      - name: Диагностика bootstrap — окно вокруг первой ошибки
        if: failure()
        run: |
          LINE=$(grep -a -n "error:" bootstrap.log | head -1 | cut -d: -f1)
          if [ -n "$LINE" ]; then
            FROM=$((LINE-5)); [ "$FROM" -lt 1 ] && FROM=1
            sed -n "${FROM},$((LINE+15))p" bootstrap.log | tr -d '\r' | while IFS= read -r l; do
              echo "::error title=first-error::$l"
            done
          fi

      - name: Диагностика bootstrap — контекст
        if: failure()
        run: |
          tail -20 bootstrap.log | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=context::$l"
          done

      - name: Пересборка нативных модулей под arm64 + Electron 11.5.0
        if: success()
        id: rebuild
        run: |
          set +e
          APM_NPM="$GITHUB_WORKSPACE/apm/node_modules/atom-package-manager/bin/npm"
          ls -l "$APM_NPM" || exit 1
          npm_config_arch=arm64 npm_config_runtime=electron npm_config_target=11.5.0 \
            "$APM_NPM" rebuild \
              --runtime=electron \
              --target=11.5.0 \
              --arch=arm64 \
              --dist-url=https://electronjs.org/headers \
              --build-from-source 2>&1 | tee rebuild.log
          exit ${PIPESTATUS[0]}

      - name: Диагностика пересборки
        if: failure()
        run: |
          grep -aiE "gyp ERR|error:|fatal error|clang|ld:" rebuild.log | tail -25 | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=rebuild::$l"
          done

      - name: Сборка приложения под arm64
        if: success()
        id: build
        env:
          npm_config_arch: arm64
        run: |
          set -o pipefail
          script/build --compress-artifacts 2>&1 | tee build.log

      - name: Диагностика сборки
        if: failure()
        run: |
          tail -30 build.log | tr -d '\r' | while IFS= read -r l; do
            echo "::error title=build::$l"
          done

      - name: Проверить, что бинарник действительно arm64
        if: success()
        run: |
          file out/Atom.app/Contents/MacOS/Atom
          ls -lh out/ | head -20

      - name: Загрузить артефакт
        if: success()
        run: |
          mkdir -p artifacts
          for f in out/*.zip; do
            cp "$f" "artifacts/$(basename "$f" .zip)-arm64.zip"
          done
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: atom-macos-arm64
          path: artifacts/*.zip
          if-no-files-found: error
